<!DOCTYPE html>
<html>
	<head>
		<title>TechFlow - Login</title>
		<link rel="stylesheet" href="style.css">
	</head>

	<body>
		<div class="wrapper">

			
			<div class="sidebar">
				<div class="brand">
					<h1>TechFlow</h1>
				
				</div>

				<a href="login.html" class="nav-btn active-login">Login</a>
				<a href="register.html" class="nav-btn">Registration</a>
			</div>

			
			<div class="main">
				<div class="card">
					<h2>Login</h2>

					<form>
						<div class="form-row">
							<label for="email">Email Address:</label>
							<input type="text" name="email" id="email">
						</div>

						<div class="form-row">
							<label for="password">Password:</label>
							<input type="password" name="password" id="password">
						</div>

						<input type="submit" value="Sign In" class="btn btn-login">
                       
					</form>

				</div>
			</div>

		</div>
	</body>
</html>
